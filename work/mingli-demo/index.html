<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ee" />
    <title>参天 · 命理综合研判</title>
    <link rel="stylesheet" href="./styles.css?v=20260918-15" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="history-sidebar" id="historySidebar" aria-label="查询记录">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">命</div>
          <strong>参天·命理综合研判</strong>
        </div>

        <button class="new-report-button" id="newReportButton" type="button">
          <span aria-hidden="true">＋</span>
          新建报告
        </button>

        <div class="history-heading">
          <h2>查询记录</h2>
          <span id="recordCount">0</span>
        </div>
        <label class="search-field">
          <span class="sr-only">搜索姓名或出生地</span>
          <span aria-hidden="true">⌕</span>
          <input id="historySearch" type="search" placeholder="搜索姓名或出生地" autocomplete="off" />
        </label>
        <div class="history-list" id="historyList" aria-live="polite"></div>
        <p class="local-note"><span class="status-dot"></span>记录仅保存在此设备</p>
      </aside>

      <main class="main-stage">
        <header class="stage-header form-mode">
          <button class="icon-button mobile-only" id="historyToggle" type="button" aria-label="打开查询记录" title="查询记录">☰</button>
          <div>
            <p class="eyebrow" id="pageEyebrow">参天·东方智慧命理研判</p>
            <h1 id="pageTitle">建立命盘，信息越准，研判越稳</h1>
          </div>
          <div class="header-actions" id="reportActions" hidden>
            <button class="secondary-button" id="editReportButton" type="button">修改资料</button>
            <button class="icon-button danger" id="deleteButton" type="button" aria-label="删除记录" title="删除记录">×</button>
          </div>
        </header>

        <section class="form-view" id="formView">
          <form id="birthForm" novalidate>
            <section class="form-section birth-section" aria-labelledby="identityHeading">
              <div class="section-heading">
                <span>01</span>
                <div>
                  <h2 id="identityHeading">出生资料</h2>
                  <p>按真实记录填写，不确定可留空</p>
                </div>
              </div>

              <div class="identity-grid">
                <label class="field full-mobile">
                  <span>姓名 <b>*</b></span>
                  <input id="name" name="name" required maxlength="40" autocomplete="name" placeholder="请输入姓名" />
                </label>

                <fieldset class="field">
                  <legend>性别</legend>
                  <div class="segmented-control">
                    <label><input type="radio" name="gender" value="male" checked /><span>男</span></label>
                    <label><input type="radio" name="gender" value="female" /><span>女</span></label>
                    <label><input type="radio" name="gender" value="unknown" /><span>未知</span></label>
                  </div>
                </fieldset>
                <fieldset class="field calendar-field">
                  <legend>历法</legend>
                  <div class="segmented-control compact">
                    <label><input type="radio" name="calendarType" value="solar" checked /><span>阳历</span></label>
                    <label><input type="radio" name="calendarType" value="lunar" /><span>农历</span></label>
                  </div>
                </fieldset>
              </div>

              <div class="birth-date-label">出生日期 <b>*</b></div>
              <div class="birth-date-grid">
                <label class="field date-part">
                  <span class="sr-only">出生年份</span>
                  <select id="year" name="year" required aria-label="出生年份" data-choice-title="选择出生年份">
                    <option value="">年份</option>
                  </select>
                </label>
                <label class="field date-part">
                  <span class="sr-only">出生月份</span>
                  <select id="month" name="month" required aria-label="出生月份" data-choice-title="选择出生月份">
                    <option value="">月份</option>
                  </select>
                </label>
                <label class="field date-part">
                  <span class="sr-only">出生日期</span>
                  <select id="day" name="day" required aria-label="出生日期" data-choice-title="选择出生日期">
                    <option value="">日期</option>
                  </select>
                </label>
                <label class="switch-row" id="leapMonthRow" hidden>
                  <input id="isLeapMonth" name="isLeapMonth" type="checkbox" />
                  <span class="switch" aria-hidden="true"></span>
                  <span>闰月</span>
                </label>
              </div>

              <div class="fields-grid birth-place-grid">
                <fieldset class="field time-choice-field">
                  <legend>出生时刻</legend>
                  <div class="time-mode-control">
                    <label><input type="radio" name="timeMode" value="exact" checked /><span>准确时间</span></label>
                    <label><input type="radio" name="timeMode" value="branch" /><span>传统时辰</span></label>
                    <label><input type="radio" name="timeMode" value="unknown" /><span>不清楚</span></label>
                  </div>
                  <div class="time-choice-detail">
                    <label id="exactTimeField">
                      <span class="sr-only">准确出生时间</span>
                      <span class="exact-time-selects">
                        <select id="exactHour" aria-label="出生小时" data-choice-title="选择出生小时">
                          <option value="">小时</option>
                        </select>
                        <i aria-hidden="true">:</i>
                        <select id="exactMinute" aria-label="出生分钟" data-choice-title="选择出生分钟">
                          <option value="">分钟</option>
                        </select>
                      </span>
                      <input id="exactTime" type="hidden" />
                    </label>
                    <label id="branchTimeField" hidden>
                      <span class="sr-only">传统出生时辰</span>
                      <select id="timeBranch" aria-label="传统出生时辰" data-choice-title="选择传统时辰">
                        <option value="">选择十二时辰</option>
                        <option value="子时">子时 · 23:00—00:59</option>
                        <option value="丑时">丑时 · 01:00—02:59</option>
                        <option value="寅时">寅时 · 03:00—04:59</option>
                        <option value="卯时">卯时 · 05:00—06:59</option>
                        <option value="辰时">辰时 · 07:00—08:59</option>
                        <option value="巳时">巳时 · 09:00—10:59</option>
                        <option value="午时">午时 · 11:00—12:59</option>
                        <option value="未时">未时 · 13:00—14:59</option>
                        <option value="申时">申时 · 15:00—16:59</option>
                        <option value="酉时">酉时 · 17:00—18:59</option>
                        <option value="戌时">戌时 · 19:00—20:59</option>
                        <option value="亥时">亥时 · 21:00—22:59</option>
                      </select>
                    </label>
                    <p id="unknownTimeHint" hidden>无需猜测，系统会按无时辰模式研判。</p>
                  </div>
                  <input id="timeText" name="timeText" type="hidden" />
                </fieldset>
                <label class="field full-mobile">
                  <span>出生地点 <b>*</b></span>
                  <input id="birthplace" name="birthplace" required maxlength="160" list="birthplaceOptions" placeholder="选择常用地点，或输入详细地址" autocomplete="off" />
                  <datalist id="birthplaceOptions"></datalist>
                  <span class="quick-place-label" id="quickPlaceLabel" hidden>常用地点</span>
                  <span class="quick-place-options" id="quickPlaceOptions"></span>
                </label>
              </div>

              <details class="precision-panel" id="precisionPanel">
                <summary>
                  <span>精度设置 <b>选填</b></span>
                  <small>经纬度、时区、资料核验</small>
                </summary>
                <div class="precision-content">
                  <div class="fields-grid three-columns">
                    <label class="field">
                      <span>经度</span>
                      <input id="longitude" name="longitude" type="number" step="0.000001" min="-180" max="180" placeholder="108.940000" />
                    </label>
                    <label class="field">
                      <span>纬度</span>
                      <input id="latitude" name="latitude" type="number" step="0.000001" min="-90" max="90" placeholder="34.340000" />
                    </label>
                    <label class="field">
                      <span>IANA 时区</span>
                      <input id="timezone" name="timezone" value="Asia/Shanghai" placeholder="Asia/Shanghai" />
                    </label>
                  </div>
                  <div class="verification-list">
                    <label class="check-row">
                      <input id="calendarVerified" name="calendarVerified" type="checkbox" />
                      <span>日期已和出生证、户籍或家人的记忆核对过</span>
                    </label>
                    <label class="check-row">
                      <input id="timeStandardVerified" name="timeStandardVerified" type="checkbox" />
                      <span>出生当年的法定时制与夏令时已核验</span>
                    </label>
                  </div>
                </div>
              </details>
            </section>

            <section class="form-section event-section">
              <details class="event-panel" id="eventPanel">
                <summary>
                  <span class="section-number">02</span>
                  <span class="event-summary-copy">
                    <strong id="eventHeading">关键经历 <em>选填</em></strong>
                    <small>用于校时与复核判断</small>
                  </span>
                  <span class="event-count" id="eventCount">0 条</span>
                </summary>
                <div class="event-panel-content">
                  <aside class="event-explainer">
                    <strong>填写某年某月发生的事实</strong>
                    <span>例如参加工作、结婚、搬家、生病或家庭变故，不需要解释原因。</span>
                  </aside>
                  <button class="secondary-button small" id="addEventButton" type="button">＋ 添加经历</button>
                  <div class="events-list" id="eventsList"></div>
                  <div class="events-empty" id="eventsEmpty">
                    <p>暂未添加</p>
                    <span>不影响生成初版报告。</span>
                  </div>
                </div>
              </details>
            </section>

            <div class="submit-bar">
              <div>
                <strong>放心填写，资料只保存在这台设备</strong>
                <span>生成后可在查询记录中随时回来看看</span>
              </div>
              <button class="primary-button" id="generateButton" type="submit">
                <span class="button-label">开启研判</span>
                <span aria-hidden="true">→</span>
              </button>
            </div>
          </form>
        </section>

        <section class="report-view" id="reportView" hidden>
          <div class="report-hero" id="reportHero"></div>
          <div class="report-layout">
            <nav class="report-index" id="reportIndex" aria-label="报告目录"></nav>
            <article class="report-content" id="reportContent"></article>
          </div>
        </section>
      </main>
    </div>

    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
    <dialog class="choice-dialog" id="choiceDialog" aria-labelledby="choiceDialogTitle">
      <div class="choice-dialog-shell">
        <header>
          <div>
            <small>参天 · 东方智慧</small>
            <h2 id="choiceDialogTitle">请选择</h2>
          </div>
          <button class="choice-dialog-close" id="choiceDialogClose" type="button" aria-label="关闭选择页" title="关闭">×</button>
        </header>
        <label class="choice-dialog-search" id="choiceDialogSearch" hidden>
          <span aria-hidden="true">⌕</span>
          <input id="choiceSearchInput" type="search" placeholder="输入数字快速查找" autocomplete="off" />
        </label>
        <div class="choice-options" id="choiceOptions"></div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="./image-library.js?v=20260918-15"></script>
    <script src="./app.js?v=20260918-15"></script>
  </body>
</html>
