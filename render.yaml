services:
  - type: web
    name: cantian-mingli-report
    runtime: python
    rootDir: work/mingli-demo
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
